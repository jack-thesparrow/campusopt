[project]
name = "campusopt"
version = "0.1.0"
description = "Hybrid optimization + prediction system for campus resource allocation"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "ortools",
    "pulp",
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "streamlit",
    "plotly",
    "pydantic",
    "python-multipart",
    "matplotlib",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pip>=26.2.1",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
